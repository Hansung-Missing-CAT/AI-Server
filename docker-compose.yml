services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file: ./server/.env
    ports:
      - "3000:3000"
    restart: unless-stopped

  ai-server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    env_file: ./ai_server/.env
    ports:
      - "8000:8000"
    restart: unless-stopped

  ai-worker:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    env_file: ./ai_server/.env
    command: ["python", "workers/ai_worker.py"]
    restart: unless-stopped
    depends_on:
      - ai-server
